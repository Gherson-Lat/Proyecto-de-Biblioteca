<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Módulo de Préstamos y Devoluciones</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; background-color: #f4f4f9; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        h2 { color: #333; }
        input[type="text"] { padding: 8px; width: 200px; margin-right: 10px; }
        button { padding: 8px 15px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background-color: #007bff; color: white; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Registrar Nuevo Préstamo</h2>
        <input type="text" id="estudiante_id" placeholder="ID Estudiante">
        <input type="text" id="libro_id" placeholder="ID Libro">
        <button onclick="registrarPrestamo()">Guardar Préstamo</button>
        <p id="msg-registro" style="color: green;"></p>
    </div>

    <div class="card">
        <h2>Préstamos Activos</h2>
        <button onclick="cargarActivos()">Cargar / Actualizar Lista</button>
        <table id="tabla-activos">
            <thead>
                <tr>
                    <th>ID Préstamo</th>
                    <th>Estudiante</th>
                    <th>Libro</th>
                    <th>Fecha Límite</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <script>
        async function registrarPrestamo() {
            const estudiante = document.getElementById('estudiante_id').value;
            const libro = document.getElementById('libro_id').value;
            
            const response = await fetch('/loans/api/registrar', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ estudiante_id: estudiante, libro_id: libro })
            });

            const res = await response.json();
            if(res.status === 'success') {
                document.getElementById('msg-registro').innerText = `✅ Préstamo #${res.data.id_prestamo} guardado hasta ${res.data.fecha_limite}`;
                cargarActivos();
            }
        }

        async function cargarActivos() {
            const response = await fetch('/loans/api/activos');
            const data = await response.json();
            const tbody = document.querySelector('#tabla-activos tbody');
            tbody.innerHTML = '';

            data.activos.forEach(p => {
                tbody.innerHTML += `<tr>
                    <td>${p.id_prestamo}</td>
                    <td>${p.estudiante_id}</td>
                    <td>${p.libro_id}</td>
                    <td>${p.fecha_limite}</td>
                </tr>`;
            });
        }
    </script>
</body>
</html>
